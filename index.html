<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destry - Women New Collection</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Header Navigation -->
    <header class="main-header">
        <div class="logo">Destry</div>
        <nav class="nav-links">
            <a href="#" class="active">Home</a>
            <a href="#">Shop</a>
            <a href="#">Pages</a>
            <a href="#">Blog</a>
            <a href="#">Contact</a>
        </nav>
        <div class="header-icons">
            <span class="icon">🔍</span>
            <span class="icon">👤</span>
            <span class="icon">❤️</span>
            <span class="icon bag-icon">👜<span class="badge">0</span></span>
        </div>
    </header>

    <!-- Side Sidebar Info Bar (Acting as layout frame footer text) -->
    <aside class="side-info-bar">
        <div class="meta-selectors">
            <span>English</span>
            <span>USD</span>
            <span>Call Us: 01234567</span>
        </div>
        <div class="promo-strip">
            Ends Monday: $100 off any dining table + 2 sets of chairs. <a href="#">Shop Now</a>
        </div>
    </aside>

    <!-- Main Hero Container Area -->
    <main class="hero-container">
        <!-- Left Side: Text Content -->
        <section class="content-side">
            <h1 class="main-heading">
                Women New<br>Collection
            </h1>
            <p class="promo-text">Up to 70% off selected Product</p>
            <a href="#" class="shop-btn">Shop Now</a>
        </section>

        <!-- Right Side: Image Backdrop Layout -->
        <section class="image-side">
            <img src="./photo-1617019114583-affb34d1b3cd.avif" alt="Model" class="model-image">
        </section>
    </main>

</body>
</html>
